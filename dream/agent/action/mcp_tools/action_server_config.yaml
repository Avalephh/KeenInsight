services:
  - name: diagnose_tools
    server_type: stdio
    params:
      command: /root/new/dream/.venv/bin/python
      args:
        - mcp_tools.py
      cwd: /root/new/dream/dream/agent/action/mcp_tools

  - name: server-sequential-thinking
    server_type: stdio
    params:
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-sequential-thinking"
      cwd: /root/new/dream

  - name: Postgres
    server_type: stdio
    params:
      command: npx
      args:
        - -y
        - "@modelcontextprotocol/server-postgres"
        - "postgresql://postgres@/keeninsight?host=/var/run/postgresql&port=5432&options=-csearch_path%3Dkeeninsight_tpcc%2Cpublic"
      cwd: /root/new/dream
