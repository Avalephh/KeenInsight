services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: keeninsight
      POSTGRES_USER: keeninsight
      POSTGRES_PASSWORD: keeninsight
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
    ports:
      - "${KI_DB_PORT:-5432}:5432"
    volumes:
      - keeninsight_pgdata:/var/lib/postgresql/data
      - ./db/init/00_extensions.sql:/docker-entrypoint-initdb.d/00_extensions.sql:ro
      - ./db/init/10_demo.sql:/docker-entrypoint-initdb.d/10_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeninsight -d keeninsight"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      KI_DATABASE_URL: postgresql://keeninsight:keeninsight@db:5432/keeninsight
      KI_COLLECT_INTERVAL_SECONDS: "5"
      KI_RAG_SYNC_INTERVAL_SECONDS: "60"
      KI_RAG_SOURCES_DIR: /app/rag_sources
      KI_HOST: 0.0.0.0
      KI_PORT: "8000"
      KI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KI_KAFKA_TOPIC: keeninsight.events
      KI_KAFKA_GROUP_ID: keeninsight-api
      KI_RAG_EMBEDDING_CACHE_DIR: /app/artifacts/embedding-cache
      KI_LLVM_SOURCE_ROOT: /app/third_party/postgresql-12.22
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${KI_APP_PORT:-8000}:8000"

volumes:
  keeninsight_pgdata:
