[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keeninsight-postgres"
version = "0.1.0"
description = "Evidence-driven PostgreSQL monitoring, diagnosis, and safe tuning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pypdf>=5,<6",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "xgboost>=2,<3",
  "shap>=0.45,<1",
  "kafka-python>=2,<3",
  "fastembed>=0.3,<1",
  "onnxruntime>=1.17,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
