[default]
instance_name = local-monitoring

[paths]
data = /root/new/monitoring/data/grafana
logs = /root/new/monitoring/logs
plugins = /root/new/monitoring/data/grafana/plugins
provisioning = /root/new/monitoring/config/grafana/provisioning

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/
enable_gzip = true

[security]
admin_user = admin
admin_password = admin

[users]
default_theme = light

[analytics]
reporting_enabled = false
check_for_updates = false

[plugins]
enable_alpha = false
check_for_updates = false

[log]
mode = console file
level = info
