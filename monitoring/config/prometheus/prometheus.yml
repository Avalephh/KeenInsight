global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/sysinsight-demo.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: postgres
    static_configs:
      - targets:
          - 127.0.0.1:9187

  # SysInsight/DREAM exposes the durable automation state as a native
  # Prometheus target. Grafana can therefore show exactly what the background
  # control loop observed, queued, validated, published, or rolled back.
  - job_name: sysinsight_dream_bridge
    static_configs:
      - targets:
          - 127.0.0.1:9108
