rule_files:
  - ../rules/sysinsight-demo.yml

evaluation_interval: 5s

tests:
  - interval: 5s
    input_series:
      - series: 'sysinsight_dream_lab_tpcc_business_tps{phase="baseline",status="running",run_id="run-1",scenario_id="tp_payment_hot"}'
        values: '1600+0x11'
      - series: 'sysinsight_dream_lab_tpcc_business_tps{phase="pressure_before",status="running",run_id="run-1",scenario_id="tp_payment_hot"}'
        values: '_ _ _ _ _ _ _ _ _ _ _ _ 1600 1400+0x65'
      - series: 'sysinsight_dream_lab_tpcc_business_tps{phase="pressure_after",status="running",run_id="run-1",scenario_id="tp_payment_hot"}'
        values: '_ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ _ 1600+0x14'
    alert_rule_test:
      - eval_time: 30s
        alertname: SysInsightDemoAnomaly
        exp_alerts: []
      - eval_time: 1m20s
        alertname: SysInsightDemoAnomaly
        exp_alerts: []
      - eval_time: 1m30s
        alertname: SysInsightDemoAnomaly
        exp_alerts: []
      - eval_time: 1m40s
        alertname: SysInsightDemoAnomaly
        exp_alerts:
          - exp_labels:
              severity: warning
              source: sysinsight-demo
              metric: target_business_tps
              drop_percent: "10"
              phase: pressure_before
              status: running
              run_id: run-1
              scenario_id: tp_payment_hot
            exp_annotations:
              summary: "Target business TPS: 10% drop for 30s"
              description: "Target business TPS is below 90% of the baseline maximum for 30 seconds."
