groups:
  - name: sysinsight-mysql-demo
    rules:
      - alert: SysInsightMySQLDemoAnomaly
        expr: |
          sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_mysql_bridge",phase="pressure_before"} > 0
          and
          sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_mysql_bridge",phase="pressure_before"}
            < 0.9 * scalar(max without (phase, status, run_id, scenario_id) (max_over_time(sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_mysql_bridge",phase="baseline"}[10m])))
          and
          # Ignore stale series from a previous lab run. Prometheus keeps the
          # last value for the lookback window, but only a fresh scrape can
          # represent pressure that is actually active now.
          (time() - timestamp(sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_mysql_bridge",phase="pressure_before"}) < 20)
        for: 30s
        labels:
          severity: warning
          source: sysinsight-mysql-demo
          metric: target_business_tps
          drop_percent: "10"
        annotations:
          summary: "MySQL target business TPS: 10% drop for 30s"
          description: "MySQL target business TPS is below 90% of the baseline maximum for 30 seconds."
