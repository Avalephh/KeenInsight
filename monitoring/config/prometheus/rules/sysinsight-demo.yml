groups:
  - name: sysinsight-demo
    rules:
      - alert: SysInsightDemoAnomaly
        # v2 system-tuning story: the anomaly is the target business TPS drop
        # during the external-pressure phase, not mere session activity.  The
        # baseline reference comes from the baseline samples of the same lab
        # run retained by Prometheus; phase matching keeps the rule silent
        # during the baseline itself and after tuning.
        expr: |
          sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_dream_bridge",phase="pressure_before"} > 0
          and
          sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_dream_bridge",phase="pressure_before"}
            < 0.9 * scalar(max without (phase, status, run_id, scenario_id) (max_over_time(sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_dream_bridge",phase="baseline"}[10m])))
          and
          # Ignore stale series from a previous lab run. Prometheus keeps the
          # last value for the lookback window, but only a fresh scrape can
          # represent pressure that is actually active now.
          (time() - timestamp(sysinsight_dream_lab_tpcc_business_tps{job="sysinsight_dream_bridge",phase="pressure_before"}) < 20)
        for: 30s
        labels:
          severity: warning
          source: sysinsight-demo
          metric: target_business_tps
          drop_percent: "10"
        annotations:
          summary: "Target business TPS: 10% drop for 30s"
          description: "Target business TPS is below 90% of the baseline maximum for 30 seconds."
