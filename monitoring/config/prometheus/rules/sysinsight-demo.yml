groups:
  - name: sysinsight-demo
    rules:
      - alert: SysInsightDemoAnomaly
        # v2 system-tuning story: the anomaly is the target business TPS drop
        # during the external-pressure phase, not mere session activity.  The
        # baseline reference comes from the baseline samples of the same lab
        # run retained by Prometheus; phase matching keeps the rule silent
        # during the baseline itself and after tuning.
        expr: |
          sysinsight_dream_lab_tpcc_business_tps{phase="pressure_before"} > 0
          and
          sysinsight_dream_lab_tpcc_business_tps{phase="pressure_before"}
            < 0.9 * scalar(max without (phase, status, run_id, scenario_id) (max_over_time(sysinsight_dream_lab_tpcc_business_tps{phase="baseline"}[10m])))
        for: 120s
        labels:
          severity: warning
          source: sysinsight-demo
          metric: target_business_tps
          drop_percent: "10"
        annotations:
          summary: "Target business TPS: 10% drop for 120s"
          description: "Target business TPS is below 90% of the baseline maximum for 120 seconds."
