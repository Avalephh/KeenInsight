<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeenInsight - Tuning-derived Knowledge</title>
    <style>
        :root {
            --primary-color: #3370ff;
            --primary-color-hover: #6694ff;
            --primary-color-light: #e8f3ff;
            --primary-color-focus: #ccdbff;
            --success-color: #0fbf60;
            --success-color-light: #e8ffea;
            --warning-color: #ff8b07;
            --warning-color-light: #fff7e8;
            --danger-color: #ee4d38;
            --danger-color-light: #fff0f0;
            --font-color: #282f38;
            --ve-navbar-height: 48px;
            --sidebar-width: 200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Roboto, Helvetica, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif;
            line-height: 1.6;
            background: #f7f8fa;
        }

        #container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #navbar {
            height: var(--ve-navbar-height);
            background: #fff;
            border-bottom: 1px solid #e5e6eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            color: var(--font-color);
            cursor: pointer;
        }

        .logo svg {
            margin-right: 8px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-action {
            display: flex;
            align-items: center;
            color: #4e5969;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-action svg {
            margin-right: 6px;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #f7f8fa;
            border-right: 1px solid #e5e6eb;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-inner {
            padding: 16px 0;
        }

        .sidebar-menu {
            padding: 0 8px;
        }

        .menu-group {
            margin-bottom: 8px;
        }

        .menu-group-title {
            padding: 8px 12px;
            font-size: 12px;
            color: #86909c;
            font-weight: 500;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            font-size: 14px;
            color: #4e5969;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            margin: 2px 0;
        }

        .menu-item:hover {
            background: #e5e6eb;
        }

        .menu-item.active {
            background: var(--primary-color);
            color: #fff;
        }

        .menu-item svg {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }

        .content-area {
            flex: 1;
            background: #f7f8fa;
            overflow: auto;
        }

        .content-inner {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--font-color);
        }

        .page-desc {
            font-size: 14px;
            color: #86909c;
            margin-top: 4px;
        }

        .action-btn {
            padding: 8px 20px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: var(--primary-color-hover);
        }

        .tuning-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .tuning-list {
            width: 100%;
            border-collapse: collapse;
        }

        .tuning-list tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .tuning-list tr:hover {
            background: #fafafa;
        }

        .tuning-list tr:last-child {
            border-bottom: none;
        }

        .tuning-list td {
            padding: 20px;
            vertical-align: top;
        }

        .tuning-col-condition {
            width: 280px;
        }

        .tuning-col-recommendation {
            flex: 1;
        }

        .tuning-col-action {
            width: 200px;
        }

        .tuning-col-confidence {
            width: 120px;
        }

        .tuning-label {
            font-size: 12px;
            color: #86909c;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .tuning-condition {
            background: var(--primary-color-light);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
        }

        .tuning-recommendation {
            font-size: 15px;
            color: var(--font-color);
            line-height: 1.7;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .tuning-action {
            background: var(--success-color-light);
            color: var(--success-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
        }

        .confidence-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .confidence-high {
            background: var(--success-color-light);
            color: var(--success-color);
        }

        .confidence-medium {
            background: var(--warning-color-light);
            color: var(--warning-color);
        }

        .confidence-low {
            background: var(--danger-color-light);
            color: var(--danger-color);
        }

        .performance-gain {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #86909c;
        }

        .performance-gain span {
            color: var(--success-color);
            font-weight: 600;
        }

        .cluster-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .cluster-badge {
            background: #f7f8fa;
            color: #4e5969;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .empty-tuning {
            text-align: center;
            padding: 80px 20px;
            background: #fff;
            border-radius: 12px;
        }

        .empty-tuning .empty-icon {
            width: 100px;
            height: 100px;
            background: #f7f8fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #86909c;
        }

        .empty-tuning .empty-text {
            font-size: 15px;
            color: #86909c;
        }
    </style>
    <link rel="stylesheet" href="portal.css">
</head>
