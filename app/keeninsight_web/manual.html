<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeenInsight - Manual</title>
    <style>
        :root {
            --primary-color: #3370ff;
            --primary-color-hover: #6694ff;
            --primary-color-light: #e8f3ff;
            --primary-color-focus: #ccdbff;
            --danger-color: #ee4d38;
            --danger-color-hover: #ff6b5a;
            --danger-color-light: #fff0f0;
            --font-color: #282f38;
            --ve-navbar-height: 48px;
            --sidebar-width: 200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Roboto, Helvetica, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif;
            line-height: 1.6;
            background: #f7f8fa;
        }

        #container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #navbar {
            height: var(--ve-navbar-height);
            background: #fff;
            border-bottom: 1px solid #e5e6eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            color: var(--font-color);
            cursor: pointer;
        }

        .logo svg {
            margin-right: 8px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-link {
            color: #4e5969;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--primary-color);
        }

        .nav-link.active {
            color: var(--primary-color);
            font-weight: 500;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-action {
            display: flex;
            align-items: center;
            color: #4e5969;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-action svg {
            margin-right: 6px;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #f7f8fa;
            border-right: 1px solid #e5e6eb;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-inner {
            padding: 16px 0;
        }

        .sidebar-header {
            padding: 0 16px 16px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--font-color);
        }

        .sidebar-header svg {
            margin-right: 8px;
        }

        .sidebar-menu {
            padding: 0 8px;
        }

        .menu-group {
            margin-bottom: 8px;
        }

        .menu-group-title {
            padding: 8px 12px;
            font-size: 12px;
            color: #86909c;
            font-weight: 500;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            font-size: 14px;
            color: #4e5969;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            margin: 2px 0;
        }

        .menu-item:hover {
            background: #e5e6eb;
        }

        .menu-item.active {
            background: var(--primary-color);
            color: #fff;
        }

        .menu-item svg {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }

        .content-area {
            flex: 1;
            background: #f7f8fa;
            overflow: auto;
        }

        .content-inner {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--font-color);
        }

        .action-btn {
            padding: 8px 20px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: var(--primary-color-hover);
        }

        .data-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: #f7f8fa;
        }

        .data-table th {
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #4e5969;
            border-bottom: 1px solid #e5e6eb;
        }

        .data-table td {
            padding: 12px 16px;
            font-size: 14px;
            color: #4e5969;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-table tbody tr:hover {
            background: #fafafa;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-icon.pdf {
            background: #fff0f0;
            color: #ee4d38;
        }

        .file-icon.doc {
            background: #e8f3ff;
            color: #3370ff;
        }

        .file-icon.xls {
            background: #e8ffea;
            color: #0fbf60;
        }

        .file-icon.ppt {
            background: #fff7e8;
            color: #ff8b07;
        }

        .file-icon.txt {
            background: #f7f8fa;
            color: #86909c;
        }

        .file-icon.zip {
            background: #f0f0ff;
            color: #665cff;
        }

        .file-info {
            flex: 1;
        }

        .file-title {
            font-weight: 500;
            color: var(--font-color);
            margin-bottom: 2px;
        }

        .file-size {
            font-size: 12px;
            color: #86909c;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .table-btn {
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .download-btn {
            background: var(--primary-color-light);
            color: var(--primary-color);
        }

        .download-btn:hover {
            background: var(--primary-color);
            color: #fff;
        }

        .delete-btn {
            background: var(--danger-color-light);
            color: var(--danger-color);
        }

        .delete-btn:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            background: #f7f8fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: #86909c;
        }

        .empty-text {
            color: #86909c;
            font-size: 14px;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-top: 1px solid #e5e6eb;
        }

        .page-info {
            font-size: 14px;
            color: #86909c;
        }

        .page-btn {
            padding: 6px 12px;
            background: #fff;
            color: #4e5969;
            border: 1px solid #e5e6eb;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: 4px;
        }

        .page-btn:hover:not(:disabled) {
            background: #f7f8fa;
        }

        .page-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .page-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .upload-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .upload-modal.show {
            display: flex;
        }

        .upload-modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }

        .upload-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e6eb;
        }

        .upload-modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--font-color);
        }

        .upload-modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #86909c;
            cursor: pointer;
            line-height: 1;
        }

        .upload-modal-close:hover {
            color: var(--font-color);
        }

        .upload-modal-body {
            padding: 20px;
        }

        .upload-area {
            border: 2px dashed #e5e6eb;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: var(--primary-color-light);
        }

        .upload-area.dragover {
            border-color: var(--primary-color);
            background: var(--primary-color-light);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .upload-text {
            color: #4e5969;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #86909c;
            font-size: 12px;
        }

        .upload-modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #e5e6eb;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-btn {
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .modal-btn.cancel {
            background: #f7f8fa;
            color: #4e5969;
            border: 1px solid #e5e6eb;
        }

        .modal-btn.cancel:hover {
            background: #e5e6eb;
        }

        .modal-btn.confirm {
            background: var(--primary-color);
            color: #fff;
        }

        .modal-btn.confirm:hover {
            background: var(--primary-color-hover);
        }

        .modal-btn.confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .file-list-preview {
            margin-top: 16px;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-preview-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f7f8fa;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .file-preview-name {
            font-size: 13px;
            color: var(--font-color);
        }

        .file-preview-remove {
            color: #86909c;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .file-preview-remove:hover {
            color: var(--danger-color);
        }

        .snippets-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .snippet-list {
            width: 100%;
            border-collapse: collapse;
        }

        .snippet-list tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .snippet-list tr:hover {
            background: #fafafa;
        }

        .snippet-list tr:last-child {
            border-bottom: none;
        }

        .snippet-list td {
            padding: 20px;
            vertical-align: top;
        }

        .snippet-source-col {
            width: 240px;
        }

        .snippet-content-col {
            flex: 1;
        }

        .snippet-source {
            font-size: 13px;
            color: #86909c;
            margin-bottom: 4px;
        }

        .snippet-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--font-color);
            margin-bottom: 8px;
        }

        .snippet-text {
            font-size: 14px;
            line-height: 1.7;
            color: #4e5969;
            margin-bottom: 12px;
        }

        .snippet-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .snippet-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .snippet-tag {
            padding: 4px 10px;
            background: var(--primary-color-light);
            color: var(--primary-color);
            font-size: 12px;
            border-radius: 4px;
        }

        .snippet-time {
            font-size: 12px;
            color: #86909c;
        }

        .snippet-action-col {
            width: 80px;
            text-align: right;
        }

        .delete-btn {
            padding: 6px 12px;
            background: var(--danger-color-light);
            color: var(--danger-color);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .delete-btn:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .empty-snippets {
            text-align: center;
            padding: 80px 20px;
            background: #fff;
            border-radius: 12px;
        }

        .empty-snippets .empty-icon {
            width: 100px;
            height: 100px;
            background: #f7f8fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #86909c;
        }

        .empty-snippets .empty-text {
            font-size: 15px;
            color: #86909c;
        }
    </style>
