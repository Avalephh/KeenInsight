<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeenInsight - Tuning-derived Knowledge</title>
    <style>
        :root {
            --primary-color: #3370ff;
            --primary-color-hover: #6694ff;
            --primary-color-light: #e8f3ff;
            --primary-color-focus: #ccdbff;
            --success-color: #0fbf60;
            --success-color-light: #e8ffea;
            --warning-color: #ff8b07;
            --warning-color-light: #fff7e8;
            --danger-color: #ee4d38;
            --danger-color-light: #fff0f0;
            --font-color: #282f38;
            --ve-navbar-height: 48px;
            --sidebar-width: 200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Roboto, Helvetica, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Arial, sans-serif;
            line-height: 1.6;
            background: #f7f8fa;
        }

        #container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #navbar {
            height: var(--ve-navbar-height);
            background: #fff;
            border-bottom: 1px solid #e5e6eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            color: var(--font-color);
            cursor: pointer;
        }

        .logo svg {
            margin-right: 8px;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-action {
            display: flex;
            align-items: center;
            color: #4e5969;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-action svg {
            margin-right: 6px;
        }

        .main-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: #f7f8fa;
            border-right: 1px solid #e5e6eb;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-inner {
            padding: 16px 0;
        }

        .sidebar-menu {
            padding: 0 8px;
        }

        .menu-group {
            margin-bottom: 8px;
        }

        .menu-group-title {
            padding: 8px 12px;
            font-size: 12px;
            color: #86909c;
            font-weight: 500;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            font-size: 14px;
            color: #4e5969;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            margin: 2px 0;
        }

        .menu-item:hover {
            background: #e5e6eb;
        }

        .menu-item.active {
            background: var(--primary-color);
            color: #fff;
        }

        .menu-item svg {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }

        .content-area {
            flex: 1;
            background: #f7f8fa;
            overflow: auto;
        }

        .content-inner {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--font-color);
        }

        .page-desc {
            font-size: 14px;
            color: #86909c;
            margin-top: 4px;
        }

        .action-btn {
            padding: 8px 20px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: var(--primary-color-hover);
        }

        .tuning-container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .tuning-list {
            width: 100%;
            border-collapse: collapse;
        }

        .tuning-list tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .tuning-list tr:hover {
            background: #fafafa;
        }

        .tuning-list tr:last-child {
            border-bottom: none;
        }

        .tuning-list td {
            padding: 20px;
            vertical-align: top;
        }

        .tuning-col-condition {
            width: 280px;
        }

        .tuning-col-recommendation {
            flex: 1;
        }

        .tuning-col-action {
            width: 200px;
        }

        .tuning-col-confidence {
            width: 120px;
        }

        .tuning-label {
            font-size: 12px;
            color: #86909c;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .tuning-condition {
            background: var(--primary-color-light);
            color: var(--primary-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
        }

        .tuning-recommendation {
            font-size: 15px;
            color: var(--font-color);
            line-height: 1.7;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .tuning-action {
            background: var(--success-color-light);
            color: var(--success-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
        }

        .confidence-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .confidence-high {
            background: var(--success-color-light);
            color: var(--success-color);
        }

        .confidence-medium {
            background: var(--warning-color-light);
            color: var(--warning-color);
        }

        .confidence-low {
            background: var(--danger-color-light);
            color: var(--danger-color);
        }

        .performance-gain {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #86909c;
        }

        .performance-gain span {
            color: var(--success-color);
            font-weight: 600;
        }

        .cluster-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .cluster-badge {
            background: #f7f8fa;
            color: #4e5969;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }

        .empty-tuning {
            text-align: center;
            padding: 80px 20px;
            background: #fff;
            border-radius: 12px;
        }

        .empty-tuning .empty-icon {
            width: 100px;
            height: 100px;
            background: #f7f8fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #86909c;
        }

        .empty-tuning .empty-text {
            font-size: 15px;
            color: #86909c;
        }
    </style>
</head>
<body>
    <div id="container">
        <header id="navbar">

                        <path fill-rule="evenodd" clip-rule="evenodd" d="M24.0001 32.5286C28.7103 32.5286 32.5286 28.7103 32.5286 24.0001C32.5286 19.29 28.7103 15.4717 24.0001 15.4717C19.29 15.4717 15.4717 19.29 15.4717 24.0001C15.4717 28.7103 19.29 32.5286 24.0001 32.5286ZM24.0001 35.5286C30.3671 35.5286 35.5286 30.3671 35.5286 24.0001C35.5286 17.6332 30.3671 12.4717 24.0001 12.4717C17.6332 12.4717 12.4717 17.6332 12.4717 24.0001C12.4717 30.3671 17.6332 35.5286 24.0001 35.5286Z" fill="#fff"/>

                            </linearGradient>
                        </defs>
                    </svg>
                    KeenInsight
                </div>

            </div>
            <div class="navbar-right">
                <div class="nav-action">
                    <svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3">
                        <path d="M24 44c11.046 0 20-8.954 20-20S35.046 4 24 4 4 12.954 4 24s8.954 20 20 20Z"/>
                        <path d="M16 24h16"/>
                    </svg>
                    Console
                </div>
                <div class="nav-action">
                    <svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3">
                        <circle cx="24" cy="24" r="18"/>

        <div class="main-wrapper">
            <aside class="sidebar">
                <div class="sidebar-inner">
                    <nav class="sidebar-menu">
                        <div class="menu-group">
                            <div class="menu-group-title">Overview</div>
                            <div class="menu-item" onclick="location.href='host-list.html'">
                                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3">
                                    <rect x="8" y="10" width="32" height="28" rx="2"/>
                                    <path d="M14 18h20M14 26h12"/>
                                </svg>
                                Clusters
                            </div>
                            <div class="menu-item" onclick="location.href='realtime-monitor.html'">
                                <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3">
                                    <circle cx="24" cy="24" r="16"/>
                                    <path d="M24 14v10l7 7"/>
                                </svg>
                                Real-time Monitor
                            </div>
                            
                            <div class="menu-group-title">System level</div>
                            <div class="menu-item" onclick="location.href='alert-list.html'">

                            </div>
                            <div class="menu-item" onclick="location.href='alert-rules.html'">

                                    <circle cx="24" cy="24" r="16"/>

                            <div class="menu-group-title">SQL level</div>
                            <div class="menu-item" onclick="location.href='sql-log.html'">

            <main class="content-area">
                <div class="content-inner">
                    <div class="page-header">
                        <h1 class="page-title">Tuning-derived Knowledge</h1>
                        <button class="action-btn" onclick="alert('Refresh tuning knowledge coming soon!')">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>

                    </div>

                    <div class="tuning-container" id="tuningContainer">
                    </div>

    </div>

    <script>
        const tuningData = [
            {
                id: 'TUNE-001',
                condition: 'When CPU usage remains high while query throughput is low',
                recommendation: 'Consider adjusting buffer pool size and reviewing slow query patterns',
                action: 'Increase appropriate buffer parameters and analyze slow query logs',
                confidence: 0.92,
                performanceGain: 35,
                clusterSize: 47,
                database: 'MySQL',
                time: 'Recently'
            },
            {
                id: 'TUNE-002',
                condition: 'When full table scans are detected frequently in query execution',
                recommendation: 'Evaluate and add appropriate indexes on commonly filtered columns',
                action: 'Create composite indexes based on frequent query patterns',
                confidence: 0.88,
                performanceGain: 42,
                clusterSize: 32,
                database: 'MySQL',
                time: 'Recently'
            },
            {
                id: 'TUNE-003',
                condition: 'When I/O congestion occurs during checkpoint operations',
                recommendation: 'Adjust checkpoint-related parameters to spread out I/O operations',
                action: 'Modify checkpoint timeout and segment settings appropriately',
                confidence: 0.85,
                performanceGain: 28,
                clusterSize: 25,
                database: 'PostgreSQL',
                time: 'Recently'
            },
            {
                id: 'TUNE-004',
                condition: 'When lock wait timeouts increase under high concurrency',
                recommendation: 'Optimize transaction size and ensure proper indexing',
                action: 'Break down large transactions and verify index effectiveness',
                confidence: 0.78,
                performanceGain: 18,
                clusterSize: 19,
                database: 'MySQL',
                time: 'Recently'
            },
            {
                id: 'TUNE-005',
                condition: 'When memory usage approaches connection capacity limits',
                recommendation: 'Balance per-connection memory settings and query optimization',
                action: 'Adjust work memory parameters and review connection pool settings',
                confidence: 0.90,
                performanceGain: 30,
                clusterSize: 28,
                database: 'PostgreSQL',
                time: 'Recently'
            },
            {
                id: 'TUNE-006',
                condition: 'When table fragmentation accumulates over time',
                recommendation: 'Consider periodic table maintenance and index rebuilding',
                action: 'Schedule regular optimization or rebuild operations',
                confidence: 0.72,
                performanceGain: 15,
                clusterSize: 15,
                database: 'MySQL',
                time: 'Recently'
            },
            {
                id: 'TUNE-007',
                condition: 'When vacuum processes cannot keep up with update volume',
                recommendation: 'Tune autovacuum workers and cost delay parameters',
                action: 'Adjust autovacuum configuration based on workload characteristics',
                confidence: 0.83,
                performanceGain: 22,
                clusterSize: 22,
                database: 'PostgreSQL',
                time: 'Recently'
            },
            {
                id: 'TUNE-008',
                condition: 'When excessive temporary tables are created on disk',
                recommendation: 'Increase temporary table memory limits appropriately',
                action: 'Adjust tmp table size configurations based on workload',
                confidence: 0.86,
                performanceGain: 25,
                clusterSize: 24,
                database: 'MySQL',
                time: 'Recently'
            }
        ];

        function getConfidenceClass(confidence) {
            if (confidence >= 0.85) return 'confidence-high';
            if (confidence >= 0.75) return 'confidence-medium';
            return 'confidence-low';
        }

        function formatConfidence(confidence) {
            return Math.round(confidence * 100) + '%';
        }

        function renderTuningKnowledge(data) {
            const container = document.getElementById('tuningContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="empty-tuning">
                        <div class="empty-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M12 14a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
                                <path d="M12 8h.01"/>
                            </svg>
                        </div>
                        <div class="empty-text">No tuning-derived knowledge yet. Insights will appear as tuning records accumulate</div>
                    </div>
                `;
            } else {
                const table = document.createElement('table');
                table.className = 'tuning-list';
                
                const tbody = document.createElement('tbody');
                
                data.forEach(item => {
                    const tr = document.createElement('tr');
                    const confidenceClass = getConfidenceClass(item.confidence);
                    tr.innerHTML = `
                        <td class="tuning-col-condition">
                            <div class="tuning-label">Condition</div>
                            <div class="tuning-condition">${item.condition}</div>
                            <div class="cluster-info">
                                <span class="cluster-badge">Cluster: ${item.clusterSize} records</span>
                                <span class="cluster-badge">${item.database}</span>
                            </div>
                        </td>
                        <td class="tuning-col-recommendation">
                            <div class="tuning-label">Recommendation</div>
                            <div class="tuning-recommendation">${item.recommendation}</div>
                            <div class="tuning-label">Action</div>
                            <div class="tuning-action">${item.action}</div>
                        </td>
                        <td class="tuning-col-confidence">
                            <div class="tuning-label">Confidence</div>
                            <div class="confidence-badge ${confidenceClass}">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                                ${formatConfidence(item.confidence)}
                            </div>
                            <div class="performance-gain">
                                <span>+${item.performanceGain}%</span> avg gain
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
                
                table.appendChild(tbody);
                container.appendChild(table);
            }
        }

        renderTuningKnowledge(tuningData);
    </script>
    <script src="/static/legacy-runtime.js"></script>
    <script src="/static/legacy-pages.js"></script>
</body>
</html>
